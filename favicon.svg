  <path d="M10.5 18 Q13 12.5 16 10.5 Q19 12.5 21.5 18" stroke="#ABB5B6" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Water ripple — Muddy Olive -->
  <path d="M10.5 20.5 Q13 18.5 16 20.5 Q19 18.5 21.5 20.5" stroke="#4C5E49" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M11.5 23 Q13.5 21.5 16 23 Q18.5 21.5 20.5 23" stroke="#4C5E49" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.6"/>
