  <polygon points="16,1 31,16 16,31 1,16" fill="#DADFE5" stroke="#ABB5B6" stroke-width="0.8"/>
  <!-- Inner diamond — Midnight Pines -->
  <polygon points="16,5 27,16 16,27 5,16" fill="#14240C"/>
